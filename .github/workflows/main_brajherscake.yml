# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - BrajhersCake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          pip check

      - name: Verify application and build deployment package
        env:
          PYTHON_DOTENV_DISABLED: '1'
          TEST_DB_CONNECTION_STRING: ''
          WHATSAPP_ENABLED: '0'
        run: |
          source antenv/bin/activate
          pip install -r requirements-dev.txt
          python scripts/build_css.py --check
          python -m pytest -q --junitxml=pytest-results.xml || {
            python scripts/report_test_failures.py pytest-results.xml
            exit 1
          }
          python scripts/build_deployment.py --output deployment.zip

      - name: Verify Gunicorn starts from the extracted deployment package
        env:
          PYTHON_DOTENV_DISABLED: '1'
          TEST_DB_CONNECTION_STRING: ''
          DB_CONNECTION_STRING: ''
          WHATSAPP_ENABLED: '0'
          FLASK_DEBUG: '0'
        run: |
          source antenv/bin/activate
          python scripts/smoke_deployment.py deployment.zip

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    concurrency:
      group: brajherscake-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy sources with Kudu ZipDeploy and verify readiness
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3B5DD3310F66485EA1C13490E7A426FB }}
        run: |
          python -m pip install requests==2.34.2
          python scripts/deploy_azure.py --package deployment.zip --app-name BrajhersCake
