<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería Amada | Registro de Cliente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: transparent;
        }

        .login-wrapper {
            width: 100%;
            max-width: 600px;
            z-index: 10;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: var(--shadow-lg), 0 0 40px rgba(217, 119, 6, 0.1);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
            color: var(--secondary);
            font-weight: 800;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .form-group.full-width {
            grid-column: span 2;
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            margin-top: 1.5rem;
            letter-spacing: 0.02em;
            grid-column: span 2;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .btn-back:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .flash-messages {
            margin-bottom: 1.5rem;
            list-style: none;
            padding: 0;
            animation: fadeIn 0.3s ease;
        }

        .flash-message {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .btn-login {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-shape shape-1"></div>
        <div class="ambient-shape shape-2"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-area">
                <h1>Panadería Amada</h1>
                <p>Crea tu cuenta de cliente</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <ul class="flash-messages">
                    {% for category, message in messages %}
                        <li class="flash-message">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            {{ message }}
                        </li>
                    {% endfor %}
                    </ul>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.cliente_registro') }}" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre">Nombres</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Tus nombres">
                    </div>
                    
                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" class="form-control" required placeholder="Tus apellidos">
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" class="form-control" required placeholder="Ej: 88888888">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Crea una contraseña">
                    </div>

                    <div class="form-group">
                        <label for="genero">Género</label>
                        <select id="genero" name="genero" class="form-control" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Otro">Otro</option>
                            <option value="Prefiero no decirlo">Prefiero no decirlo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-control" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="foto">Foto de Perfil (Opcional)</label>
                        <input type="file" id="foto" name="foto" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary btn-login">Registrar Cuenta</button>
                </div>
            </form>
            
            <a href="{{ url_for('auth.cliente_bienvenida') }}" class="btn-back">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
