<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco de Marcaje — Brajher's Cake</title>
    <meta name="description" content="Sistema de marcaje de asistencia con reconocimiento facial para empleados.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/common.js') }}" defer></script>
    <link rel="stylesheet" href="{{ css_url('accessibility') }}">
    <link rel="stylesheet" href="{{ css_url('pages/kiosk/attendance') }}">
    <link rel="stylesheet" href="{{ css_url('motion') }}">
</head>
<body class="page-kiosco">

    <div class="kiosco-header">
        <div class="brand">FaceID Access</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">Cargando...</div>
    </div>

    <div class="camera-wrapper">
        <div class="camera-container" id="cameraBox">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <div class="scan-overlay" id="scanOverlay">
                <div class="scan-line"></div>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Inicializando cámara...</span>
    </div>

    <div class="kiosk-mark-actions" role="group" aria-label="Selecciona el marcaje">
        <button type="button" id="markEntry" aria-pressed="false">Registrar entrada</button>
        <button type="button" id="markExit" aria-pressed="false">Registrar salida</button>
    </div>

    <div class="instructions" id="instructions">
        <p>Selecciona entrada o salida y acércate a la cámara</p>
    </div>

    <div id="toast"></div>

    <script>
        // ═══════════════════════════════════════════
        // KIOSCO DE MARCAJE — BACKEND FACE RECOGNITION
        // ═══════════════════════════════════════════

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const statusBar = document.getElementById('statusBar');
        const cameraBox = document.getElementById('cameraBox');
        const instructions = document.getElementById('instructions');
        const scanOverlay = document.getElementById('scanOverlay');

        let scanInterval = null;
        let isRequestPending = false;
        let isPaused = true;
        let selectedAction = null;
        const markEntry = document.getElementById('markEntry');
        const markExit = document.getElementById('markExit');

        function selectAction(action) {
            if (isRequestPending) return;
            selectedAction = action;
            markEntry.setAttribute('aria-pressed', String(action === 'entrada'));
            markExit.setAttribute('aria-pressed', String(action === 'salida'));
            isPaused = false;
            scanOverlay.classList.remove('paused');
            statusBar.classList.remove('paused');
            statusBar.classList.add('ready');
            statusText.textContent = `Registrar ${action} — Acércate a la cámara`;
        }
        markEntry.addEventListener('click', () => selectAction('entrada'));
        markExit.addEventListener('click', () => selectAction('salida'));

        // ─── RELOJ ───
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleTimeString('es-NI', { hour12: false });
            document.getElementById('date').textContent =
                now.toLocaleDateString('es-NI', {
                    weekday: 'long', year: 'numeric',
                    month: 'long', day: 'numeric'
                }).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ─── TOAST Y EFECTOS ───
        function showToast(msg, tipo = 'entrada') {
            const toast = document.getElementById('toast');
            let icon = '✅';
            let cssClass = 'toast-entrada';

            if (tipo === 'salida') {
                icon = '👋';
                cssClass = 'toast-salida';
            } else if (tipo === 'error' || tipo === 'completado') {
                icon = '⚠️';
                cssClass = 'toast-error';
            }

            const iconNode = document.createElement('span');
            iconNode.className = 'toast-icon';
            iconNode.textContent = icon;
            toast.replaceChildren(iconNode, document.createTextNode(` ${msg}`));
            toast.className = `show ${cssClass}`;

            // Flash en cámara
            cameraBox.classList.remove('flash-entrada', 'flash-salida', 'flash-error');
            if (tipo === 'entrada') cameraBox.classList.add('flash-entrada');
            else if (tipo === 'salida') cameraBox.classList.add('flash-salida');
            else cameraBox.classList.add('flash-error');

            setTimeout(() => {
                toast.className = '';
                cameraBox.classList.remove('flash-entrada', 'flash-salida', 'flash-error');
            }, 5000);
        }

        function playBeep(isEntrada) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = isEntrada ? 880 : 660;
                gain.gain.value = 0.15;
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) { /* Audio not supported */ }
        }

        // ─── CÁMARA ───
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: "user" }
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    statusText.textContent = 'IA lista — Selecciona entrada o salida';
                    statusBar.classList.remove('error-state');
                    statusBar.classList.add('ready');
                    instructions.classList.add('visible');

                    // Iniciar el loop de envío de frames al backend
                    startScanning();
                };
            } catch (err) {
                console.error('Error accediendo a la cámara:', err);
                statusText.textContent = 'Error: No se pudo acceder a la cámara.';
                statusBar.classList.add('error-state');
            }
        }

        // ─── LÓGICA DE ESCANEO ───
        function startScanning() {
            if (scanInterval) clearInterval(scanInterval);
            // Ejecutar captura y reconocimiento cada 1000 ms (1 segundo)
            scanInterval = setInterval(processFrame, 1000);
        }

        async function processFrame() {
            if (isPaused || isRequestPending || !selectedAction) return;

            isRequestPending = true;
            markEntry.disabled = true;
            markExit.disabled = true;

            try {
                // Dibujar el video en el canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Exportar como imagen JPEG comprimida para ahorrar ancho de banda
                const base64Image = canvas.toDataURL('image/jpeg', 0.6);

                const response = await fetch('/kiosco/api/kiosco/reconocer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image, accion: selectedAction })
                });

                const data = await response.json();
                if (!response.ok || data.status === 'error') {
                    showToast(data.message || 'No se pudo registrar el marcaje.', 'error');
                    pauseScanning();
                } else {

                    if (data.status === 'success') {
                        // Marcaje exitoso (entrada o salida)
                        handleSuccess(data);
                    } else if (data.status === 'completado') {
                        // Ya completó la jornada
                        handleSuccess(data);
                    }
                    // Si es 'no_face' o 'unknown', no hacemos nada (seguimos escaneando silenciosamente)
                }
            } catch (error) {
                console.error('Error enviando frame al backend:', error);
            } finally {
                isRequestPending = false;
                markEntry.disabled = false;
                markExit.disabled = false;
            }
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                // Cancelar si ya está hablando para no encolar audios
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-MX'; // Español latino genérico
                utterance.rate = 1.0; // Velocidad normal
                utterance.pitch = 1.1; // Tono ligeramente más amigable

                window.speechSynthesis.speak(utterance);
            }
        }

        function handleSuccess(data) {
            // Mostrar mensaje y hablar
            if (data.status === 'success') {
                showToast(data.mensaje, data.tipo);
                playBeep(data.tipo === 'entrada');
                hablar(data.mensaje);
            } else {
                showToast(data.mensaje, 'completado');
                playBeep(false);
                hablar(data.mensaje);
            }

            // Cada marcaje requiere una nueva selección explícita.
            pauseScanning();
        }

        function pauseScanning() {
            isPaused = true;
            selectedAction = null;
            markEntry.setAttribute('aria-pressed', 'false');
            markExit.setAttribute('aria-pressed', 'false');
            scanOverlay.classList.add('paused');
            statusText.textContent = 'Selecciona entrada o salida para el siguiente marcaje';
            statusBar.classList.remove('ready');
            statusBar.classList.add('paused');

        }

        // ─── ARRANCAR ───
        window.addEventListener('DOMContentLoaded', initCamera);

    </script>
</body>
</html>
