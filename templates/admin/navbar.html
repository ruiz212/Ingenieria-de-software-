    <header class="app-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="/admin/dashboard" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-size: 2rem;">🥐</span>
                <h1 style="font-size: 1.5rem; margin: 0; color: var(--secondary);">Panadería Amada</h1>
            </a>
            
            <nav style="display: flex; gap: 1.5rem; border-left: 2px solid var(--border); padding-left: 2rem;">
                <a href="/admin/dashboard" style="text-decoration: none; color: {% if request.path == '/admin/dashboard' %}var(--primary-color){% else %}var(--text-muted){% endif %}; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    📊 Dashboard
                </a>
                <a href="/pos" style="text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    🛒 POS
                </a>
                <a href="/monitor" style="text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    🧑‍🍳 Monitor
                </a>
                <a href="/admin/catalogo" style="text-decoration: none; color: {% if request.path == '/admin/catalogo' %}var(--primary-color){% else %}var(--text-muted){% endif %}; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    📝 Catálogo
                </a>
                <a href="/admin/usuarios" style="text-decoration: none; color: {% if request.path == '/admin/usuarios' %}var(--primary-color){% else %}var(--text-muted){% endif %}; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    👥 Usuarios
                </a>
                <a href="/admin/contabilidad" style="text-decoration: none; color: {% if request.path == '/admin/contabilidad' %}var(--primary-color){% else %}var(--text-muted){% endif %}; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.25rem;">
                    💰 Contabilidad
                </a>
            </nav>
        </div>
        
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div class="user-info" style="color: var(--text-muted); font-weight: 500; font-size: 0.875rem;">
                {{ user.nombre_completo }} <span style="background: rgba(212, 175, 55, 0.15); color: var(--primary-color); padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 700; font-size: 0.75rem; margin-left: 0.5rem;">{{ user.rol_nombre }}</span>
            </div>
            <a href="/logout" class="btn-return" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);">Cerrar Sesión</a>
        </div>
    </header>
