<header class="app-header">
    <div style="display: flex; align-items: center; height: 100%; flex: 1; min-width: 0;">
        <a href="/admin/dashboard" class="admin-nav-brand" style="flex-shrink: 0;">
            <div class="brand-icon">🥐</div>
            <span class="brand-text">Panadería Amada</span>
        </a>

        <nav class="admin-nav-links">
            <a href="/admin/dashboard" class="admin-nav-link {% if request.path == '/admin/dashboard' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/pos" class="admin-nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
                <span>POS</span>
            </a>
            <a href="/monitor" class="admin-nav-link {% if request.path == '/monitor' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span>Monitor</span>
            </a>
            <a href="/admin/catalogo" class="admin-nav-link {% if request.path == '/admin/catalogo' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Catálogo</span>
            </a>
            <a href="/admin/contabilidad" class="admin-nav-link {% if request.path == '/admin/contabilidad' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                <span>Finanzas</span>
            </a>
            <a href="/admin/fidelizacion" class="admin-nav-link {% if request.path == '/admin/fidelizacion' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                <span>Clientes</span>
            </a>

            <!-- Menú desplegable "Más" para módulos secundarios -->
            <div class="nav-dropdown-wrapper" id="nav-mas-wrapper">
                <button class="admin-nav-link nav-dropdown-trigger {% if request.path in ['/admin/usuarios', '/admin/inventario', '/admin/produccion', '/admin/configuracion'] %}active{% endif %}" onclick="toggleNavMore(event)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    <span>Más</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;margin-left:2px;flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="nav-dropdown-menu" id="nav-mas-menu">
                    <a href="/admin/usuarios" class="nav-dropdown-item {% if request.path == '/admin/usuarios' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                        Usuarios
                    </a>
                    <a href="/admin/inventario" class="nav-dropdown-item {% if request.path == '/admin/inventario' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                        Inventario
                    </a>
                    <a href="/admin/produccion" class="nav-dropdown-item {% if request.path == '/admin/produccion' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                        Producción
                    </a>
                    <a href="/admin/configuracion" class="nav-dropdown-item {% if request.path == '/admin/configuracion' %}active{% endif %}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                        Configuración
                    </a>
                </div>
            </div>
        </nav>
    </div>

    <div class="admin-nav-right">
        <div class="admin-nav-user">
            {{ user.nombre_completo }}
            <span class="admin-nav-role">{{ user.rol_nombre }}</span>
        </div>
        {% if not user.totp_enabled %}
            <a href="/perfil/setup_totp" class="btn btn-outline btn-sm" title="Activar verificación en dos pasos">🔐</a>
        {% endif %}
        <a href="/logout" class="btn btn-danger-outline btn-sm">Cerrar Sesión</a>
    </div>
</header>

<script>
function toggleNavMore(e) {
    e.stopPropagation();
    const menu = document.getElementById('nav-mas-menu');
    const isOpen = menu.classList.contains('open');
    menu.classList.toggle('open', !isOpen);
}
document.addEventListener('click', function() {
    const menu = document.getElementById('nav-mas-menu');
    if (menu) menu.classList.remove('open');
});
</script>
